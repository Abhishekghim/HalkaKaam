<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003893" />
      <stop offset="100%" stop-color="#00225A" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC143C" />
      <stop offset="100%" stop-color="#B80F32" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />

  <!-- Inner Soft Accent Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Center Crimson Shield/Pennant -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Upper Pennant -->
    <polygon points="30,40 270,140 30,170" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
    <!-- Lower Pennant -->
    <polygon points="30,170 270,270 30,300" fill="url(#redGrad)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
    <!-- Flagpole Spine -->
    <line x1="30" y1="20" x2="30" y2="340" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <!-- Top Sun/Moon Emblems -->
    <circle cx="100" cy="115" r="22" fill="#FFFFFF" />
    <circle cx="100" cy="245" r="24" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography -->
  <text x="256" y="455" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" letter-spacing="3">SAJHA KAAM</text>
</svg>

